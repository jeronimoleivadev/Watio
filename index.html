<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WATIO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- */ Una para el encabezado de la página (donde más adelante irá el logo y menú). -->
        <div class="marca">
            <img src="img/logo.png" alt="Logo de Watio" class="logo">
            <div>
                <h1 class="titulo">Watio</h1>
                <p class="dis">Tu tienda de electrodomesticos</p>
            </div>
        </div>

        <nav>
            <div>
                <button class="btn-inicio">Inicio</button>
                <button class="btn-ofertas">Ofertas</button>
                <button class="btn-productos">Productos</button>
            </div>
        </nav>
    </header>

    <main>
        <!-- */ Una para el contenido principal de la página. -->
        <h1>Bienvenido a Watio</h1>
        <p>Explora nuestra amplia selección de electrodomésticos de calidad.</p>
        
        <section class="productos"></section>

        <section class="filtros">
            <h2>Filtrar productos de Watio</h2>
            <div class="contenedores">
                <button class="btn-todo" data-categoria="todos">Todos</button>
                <button class="btn-heladeras" data-categoria="heladeras">Electrodomésticos</button>
                <button class="btn-lavarropas" data-categoria="lavarropas">herramientas</button>
                <button class="btn-microondas" data-categoria="microondas">electronicos</button>
            </div>
        </section>
    </main>



    <footer>
        <!-- */ Una para el pie de página (donde van derechos de autor, enlaces, etc.). -->
        <p>Contacto: WhatsApp | Instagram</p>

    </footer>

    <script src="script.js"></script>
</body>

</html>
